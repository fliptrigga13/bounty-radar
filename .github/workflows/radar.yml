name: bounty-radar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_DB: radar.db
        run: |
          python radar.py --once || true
      - name: Commit state
        run: |
          git config user.name "bounty-radar"
          git config user.email "radar@local"
          git add radar.db 2>/dev/null
          git diff --cached --quiet || git commit -m "update radar state"
          git push
